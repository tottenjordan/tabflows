[project]
name = "tabflows"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Jordan", email = "jordantotten@google.com" }
]
requires-python = ">=3.11"
dependencies = [
    "click>=8.4.2",
    "google-cloud-aiplatform>=1.164.0",
    "google-cloud-pipeline-components>=2.22.0",
    "google-cloud-storage>=3.13.1",
    "kfp>=2.17.0",
    "pydantic>=2.13.4",
]

[project.scripts]
tabflows = "tabflows.cli:main"

[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true

[build-system]
requires = ["uv_build>=0.9.14,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.2",
    "ty>=0.0.70",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=tabflows --cov-report=term-missing"

[tool.ty.environment]
python-version = "3.11"

