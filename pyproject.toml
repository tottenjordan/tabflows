[project]
name = "tabflows"
version = "0.1.0"
description = "AutoML Tabular classification workflows on Google Cloud Vertex AI Pipelines"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [
    { name = "Jordan Totten", email = "jordantotten@google.com" }
]
keywords = [
    "automl",
    "google-cloud",
    "kfp",
    "machine-learning",
    "pipelines",
    "tabular",
    "vertex-ai",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.11"
dependencies = [
    "click>=8.4.2",
    "google-cloud-aiplatform>=1.164.0",
    "google-cloud-pipeline-components>=2.22.0",
    "google-cloud-storage>=3.13.1",
    "kfp>=2.17.0",
    "pandas>=2.0.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
]

[project.urls]
Homepage = "https://github.com/tottenjordan/tabflows"
Repository = "https://github.com/tottenjordan/tabflows"
Documentation = "https://github.com/tottenjordan/tabflows#readme"

[project.scripts]
tabflows = "tabflows.cli:main"

[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.2",
    "ty>=0.0.70",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=tabflows --cov-report=term-missing"

[tool.ty.environment]
python-version = "3.11"

